<!-- Prepared replacement for the offer page on the old demo host.

     full query string so ?src=<slug> attribution survives the hop.

    // per-slug ?src= attribution lands intact on the new offer page.
    window.location.replace(
        'https://ranklydesign.com/offer/' + window.location.search + window.location.hash
    );
</script>
